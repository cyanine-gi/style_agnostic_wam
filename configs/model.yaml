# 模型配置（guideline v2 / 隐空间与监督设计 §2、§7、§8 的唯一事实来源）
# 所有权重经 ModelScope 下载至本地，运行时禁止联网拉取。
# 历史：v1 版（dinov2-base 冻结）已废弃，勿参考；encoder 全程可微调是 v2 硬规格。

paths:
  encoder: pretrained_models/dinov2-small-reg           # DINOv2-S/14 registers（HF 格式，22M）
  teacher: pretrained_models/Depth-Anything-V2-Large-hf # Depth Anything V2-L 稠密深度教师
  vlm: pretrained_models/Qwen3-VL-2B-Instruct           # Stage 3 VLA backbone

latent:
  grid_size: 16        # 16×16=256 patch token；空间网格是深度可解码性下限，不可压
  dim: 384             # 每帧 256×384 = 98,304 维；显存富余先升通道再升分辨率
  image_size: 224      # 输入分辨率（位置编码自动插值）

encoder:
  name: dinov2-small-reg
  patch: 14
  frozen: false        # v2 硬规格：禁止冻结（Stage 0 深度塑形 + Stage 2 GRL 除域都要梯度进 E）
  lr: 1.0e-4           # 预训练初始化，低于从零训练的 3e-4 量级
  anti_drift:
    enabled: true      # 防漂移锚：冻结 DINOv2 副本 + 小权重特征蒸馏正则
    distill_weight: 0.1  # 小权重起步，按 SSL 探针监控回调；覆盖 patch+register 全槽位
  # 2026-09-14 裁决：register 分角色（初始化对称，纯约定 + 损失塑形）
  register_roles:
    domain: [0, 1]     # 域信息槽位：被动锚定携带域信息 + 探针监控（先量后治）
    agnostic: [2, 3]   # 域无关槽位：全局信号头只读这里；Stage 2 GRL 只挂这里

# 可插拔监督信号注册表（src/sawvla/signals/，用法见 base.py docstring）：
# 新增信号 = SignalHead 子类 + @register_signal + 此处加一行，trainer 不动
signals:
  joint_pos:
    enabled: true      # 双臂关节位置回归 14 维（剔除夹爪：sim 连续 / real 二值不同纲）
    weight: 0.1        # 小权重起步，按 signals/joint_pos 曲线回调

transition:
  d: 384
  action_dim: 16       # [已核实 2026-09-11] Franka：双臂7关节+双夹爪（configs/data.yaml curves）
  proprio_dim: 16      # 同构，puppet 实测
  depth: 8             # ≈20M 参数（上限 ≤100M）；欠拟合先加课程/深度，最后动宽度
  n_heads: 6
  mlp_ratio: 4.0
  action_tokens: per_step  # 已裁决 2026-09-11：每步动作 1 token，k 步=k token，禁止整块压缩
  n_cond: 2            # 每帧条件 token 数：1 本体感 + 1 动作（逐帧 block 交错）
  n_reg: 4             # [已裁决 2026-09-15] register 通道由 T 递推：block = 256 patch + 4 register + 2 cond
  causal: block        # block-causal：第 j+1 帧预测只见 a_{≤j}（overall_tensor_flow §3.2）
  max_frames: 16       # 帧索引 embedding 表大小（多步展开上限）
  frameskip: [1, 2, 4, 8]  # 训练时随机采样，避免平凡复制解
  unroll_steps: [1, 2, 4]  # 多步展开损失步数
  dyn_weight: true     # 动态区域损失加权（按相邻帧 latent 差）
  lr: 1.0e-4

# Stage 1 训练（scripts/train_stage1.py；2026-09-15 裁决定稿）
stage1:
  cache_dir: outputs/latent_cache   # scripts/build_latent_cache.py 产物
  context_frames: 2      # [已裁决] 滑窗上下文 2 帧（速度可观测下限；1 帧盲于物体动量）
  unroll_steps: 4        # 固定最大展开 4 步、逐步监督（等效覆盖 k∈{1,2,4}）
  clip_stride: 1         # 保留帧流上的帧跳（>1 等价 frameskip；抽稀已承担主要角色）
  batch: 8
  lr: 1.0e-4
  reg_dyn_weight: 1.0    # register 通道 L_dyn 权重（r̂ 监督，与 patch 并列）
  # 预测端监督对等（2026-09-15 裁决："T 预测输出与 E 编码输出尽量不可分辨，
  # 深度、joint_pos 及未来注册的其他 loss 都要有"）：
  signals_on_prediction:
    enabled: true        # 注册信号同时挂 r̂/ẑ（与 E 侧同一批头、同一权重）
    grad_into_t: true    # 选项 A：信号梯度进 T（塑形 r̂）；false = 未来选项 C 消融
  depth_on_prediction:
    enabled: true        # D 同时解码 ẑ（训练 D + 监控预测帧深度）
    grad_into_t: false   # 选项 A：深度对 T 保持 stop-grad（DINO-WM 消融惯例，§2.2）

# Stage 2 联合微调 + 域对抗（scripts/train_stage2.py；2026-09-16 裁决）
stage2:
  batch: 4               # 在线 E 编码 L=6 帧/clip：B×6 图前向+反传，显存约束
  lr: 5.0e-5             # 联合微调小 lr（guideline §6 Stage 2：3e-5~1e-4）
  clip_stride: 1
  domain_balanced: true  # GRL batch 精确 50/50（guideline §9.1 硬要求）
  anchor:
    distill_weight: 0.1
    scope: [patch, reg_domain]  # [裁决 2026-09-16] reg_agnostic 不再锚定，让位 GRL 自由清理
  grl:
    on_encoder: true     # GRL 挂 E 的 reg_agnostic（Stage 2 主战场）
    on_prediction: true  # GRL 同挂 T 的 r̂ reg_agnostic（T 递推 register ⇒ ẑ 侧同挂，§2.2）
  # [2026-09-17 裁决·三] 清洗目标双开关（规格：src/sawvla/train_failed_log.md）。
  # HSIC：非对弈惩罚，跨步 FIFO 缓冲作统计基底；熵混淆：推向批次经验先验
  # π̂（不写死 0.5，数据集不均衡），开启时才建判别器。λ_hsic 冒烟试定。
  adv:
    hsic:    { enabled: true,  weight: 1.0,  ramp_steps: 10000, buffer_size: 256 }
    entropy: { enabled: false, weight: 0.03, ramp_steps: 10000 }

depth_decoder:
  out_size: 64         # 64×64（上限 112×112）；满分辨率仅评估/可视化
  width1: 256
  width2: 128
  use_uv: true         # 入口拼接归一化 uv 坐标 2 通道（助深度边缘对齐）
  log_sigma_min: -3.0  # log σ clamp，防塌缩
  log_sigma_max: 5.0
  # 硬约束：输入只允许 z，禁止 encoder skip connection（代码评审检查项）

discriminator:
  hidden: 128          # ~1M 参数，刻意小容量防 GRL 不稳
  # [2026-09-17 裁决·三] 判别器只在 stage2.adv.entropy.enabled=true 时建造；
  # 以下 lr/内循环仅在那时生效（detach 特征，唯一训练通路）。
  disc_lr: 3.0e-4
  disc_inner_steps: 4

loss:
  lambda_metric: 1.0   # 异方差 Laplacian NLL，仅传感器有效点
  lambda_teacher: 1.0  # 教师稠密蒸馏（scale-and-shift 对齐），主监督
  lambda_grad: 0.5     # 多尺度梯度损失（4 级：64/32/16/8）
  lambda_smooth: 0.1   # RGB 边缘感知平滑，仅空洞区
  n_grad_scales: 4
  pool_valid_thresh: 0.5  # 掩码感知降采样的有效比例阈值

teacher:
  name: depth-anything-v2-large
  input_size: 518      # 离线推理 batch 8 @ 518px；两域同一 checkpoint
  # 教师输出相对深度（affine-invariant），经 per-image scale-and-shift 对齐进损失

vlm:
  name: qwen3-vl-2b-instruct
  attn_implementation: sdpa  # Stage 3：LoRA + 8-bit 优化器，禁止全量微调

# VLA 侧组件（已裁决 2026-09-11）：跟着 VLA 走，不是 WAM 本体；
# WAM 对外接口恒定 256×384 patch token，是否/如何压缩是本 adapter 的内部事务。
vla_adapter:
  d: 384             # 输入：WAM latent 通道
  d_inner: 512       # 逐 token Linear(d→d_inner)+GELU；刻意凑 4×d_inner == llm_dim
  pool: 2            # space-to-depth 2×2 → 8×8=64 token（无损重排，保 uv 结构）
  llm_dim: 2048      # Qwen3-VL-2B text hidden（以本地 config.json 为准）；换 VLM 必须同步改
